{% extends "base.html" %}

{% block title %}Register - QuizMaster Pro{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-lg">
        <div class="bg-slate-900/90 border border-slate-800 rounded-3xl p-8 shadow-2xl backdrop-blur-xl relative">
            <div class="text-center mb-6">
                <div class="inline-flex w-14 h-14 rounded-2xl bg-indigo-500/10 border border-indigo-500/20 items-center justify-center text-brand-400 text-2xl mb-3 shadow-inner">
                    <i class="fa-solid fa-user-plus"></i>
                </div>
                <h2 class="text-2xl font-extrabold text-white tracking-tight">Create Your Account</h2>
                <p class="text-sm text-slate-400 mt-1">Join thousands mastering subjects with timed challenges</p>
            </div>

            <form action="{{ url_for('register') }}" method="POST" class="space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Full Name</label>
                        <input type="text" name="full_name" required placeholder="Marcus Aurelius"
                               class="w-full px-4 py-3 bg-slate-950/80 border border-slate-800 rounded-xl text-white placeholder-slate-500 text-sm focus:outline-none focus:border-brand-500 transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Username</label>
                        <input type="text" name="username" required placeholder="marcus_quiz"
                               class="w-full px-4 py-3 bg-slate-950/80 border border-slate-800 rounded-xl text-white placeholder-slate-500 text-sm focus:outline-none focus:border-brand-500 transition-all">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Email Address</label>
                    <input type="email" name="email" required placeholder="marcus@domain.com"
                           class="w-full px-4 py-3 bg-slate-950/80 border border-slate-800 rounded-xl text-white placeholder-slate-500 text-sm focus:outline-none focus:border-brand-500 transition-all">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Password</label>
                        <input type="password" name="password" required placeholder="••••••••"
                               class="w-full px-4 py-3 bg-slate-950/80 border border-slate-800 rounded-xl text-white placeholder-slate-500 text-sm focus:outline-none focus:border-brand-500 transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Confirm Password</label>
                        <input type="password" name="confirm_password" required placeholder="••••••••"
                               class="w-full px-4 py-3 bg-slate-950/80 border border-slate-800 rounded-xl text-white placeholder-slate-500 text-sm focus:outline-none focus:border-brand-500 transition-all">
                    </div>
                </div>

                <!-- Avatar Selection -->
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Choose Avatar Badge</label>
                    <div class="grid grid-cols-5 gap-3" id="avatarSelector">
                        {% for i in range(1, 6) %}
                        <label class="cursor-pointer">
                            <input type="radio" name="avatar" value="avatar{{ i }}.png" class="sr-only peer" {% if i == 1 %}checked{% endif %}>
                            <div class="w-12 h-12 rounded-xl bg-slate-800 border-2 border-slate-700 peer-checked:border-brand-500 peer-checked:bg-brand-500/20 flex items-center justify-center text-lg text-slate-300 peer-checked:text-white transition-all hover:scale-105">
                                <i class="fa-solid fa-{% if i == 1 %}user-ninja{% elif i == 2 %}user-astronaut{% elif i == 3 %}user-tie{% elif i == 4 %}brain{% else %}fire{% endif %}"></i>
                            </div>
                        </label>
                        {% endfor %}
                    </div>
                </div>

                <button type="submit" class="w-full py-3.5 px-4 rounded-xl text-sm font-bold text-white bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-500 hover:to-indigo-500 shadow-lg shadow-indigo-600/30 transition-all mt-4">
                    Create QuizMaster Account
                </button>
            </form>

            <div class="mt-6 text-center text-xs text-slate-400">
                Already registered? 
                <a href="{{ url_for('login') }}" class="font-bold text-indigo-400 hover:text-indigo-300 ml-1">Sign in here</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
